# Suite contains  tier-2 rados bug verification automation
#===============================================================================================
#------------------------------------------------------------------------------------------
#----- Tier-2 - Bug verification  automation   ------
#------------------------------------------------------------------------------------------
# Conf: conf/squid/rados/11-node-cluster.yaml
# Bugs:
#     1. https://bugzilla.redhat.com/show_bug.cgi?id=2305677
#===============================================================================================
# RHOS-d run duration: 80 mins
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      polarion-id:
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 7.1
                release: z0
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Encrypted OSD deployment on LVMs
      desc: Deploy encrypted OSDs on LVs
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_encrypted_lv
                  encrypted: "true"
                  placement:
                    label: osd_encrypt_lv
                  spec:
                    data_devices:
                      size: "'1G:'"

  - test:
      name: Encrypted OSD deployment on RAW device
      desc: Deploy encrypted OSDs on RAW devices
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_encrypted_raw
                  encrypted: "true"
                  placement:
                    label: osd_encrypt_raw
                  spec:
                    method: raw
                    data_devices:
                      size: "'1G:'"

  - test:
      name: non-encrypted OSD deployment on LVM
      desc: Deploy non-encrypted OSDs on LVs
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_lv
                  placement:
                    label: osd_lv
                  spec:
                    data_devices:
                      size: "'1G:'"

  - test:
      name: non-encrypted OSD deployment on RAW device
      desc: Deploy non-encrypted OSDs on RAW devices
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_raw
                  placement:
                    label: osd_raw
                  spec:
                    method: raw
                    data_devices:
                      size: "'1G:'"

  - test:
      name: MDS Service deployment with spec
      desc: Add MDS services using spec file
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      config:
        steps:
          - config:
              command: shell
              args:               # arguments to ceph orch
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: mds
                  service_id: cephfs
                  placement:
                    label: mds

  - test:
      name: RGW Service deployment
      desc: RGW Service deployment
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      config:
        steps:
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw

  - test:
      name: Configure client admin
      desc: Configures client admin node on cluster
      module: test_client.py
      polarion-id:
      config:
        command: add
        id: client.1                      # client Id (<type>.<Id>)
        nodes:                            # client node
          - node7:
              release: 7.1
              tag: z0
        install_packages:
          - ceph-common
        copy_admin_keyring: true          # Copy admin keyring to node
        caps:                             # authorize client capabilities
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
      desc: Change config options to enable logging to file

  # RHOS-d run duration: 8 mins
  - test:
      name: MGR regression test
      module: test_mgr_daemon.py
      polarion-id: CEPH-83586116
      desc: MGR regression testing

  - test:
      name: Reproducing the Ceph mgr crash bug
      module: test_node_drain_customer_bug.py
      polarion-id: CEPH-83595932
      abort-on-fail: true
      config:
        replicated_pool:
          create: true
          pool_name: mgr_test_pool
          delete_pool: mgr_test_pool
      desc: Reproducing the Ceph mgr crashed after a mgr failover

  - test:
      name: Upgrade cluster to latest 8.x ceph version
      desc: Upgrade cluster to latest version
      module: test_upgrade_warn.py
      polarion-id: CEPH-83574934
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true
        verify_cluster_health: true
      destroy-cluster: false
      abort-on-fail: true

