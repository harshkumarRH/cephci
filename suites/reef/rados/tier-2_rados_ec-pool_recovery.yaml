# Suite contains tier-2 rados test: EC Pool recovery
# CLuster should have atleast 6 OSD hosts for testing.
# Suited best for BM pipeline.
# Can be run on RHOS-d env as well.

tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      polarion-id:
      config:
        verify_cluster_health: true
        steps:
          - config:
              service: cephadm
              command: bootstrap
              base_cmd_args:
                verbose: true
              args:
                rhcs-version: 7.1
                release: z8
                platform: rhel-9
                orphan-initial-daemons: true
                registry-url: registry.redhat.io
                mon-ip: node1
                allow-fqdn-hostname: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Encrypted OSD deployment on LVMs
      desc: Deploy encrypted OSDs on LVs
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_encrypted_lv
                  encrypted: "true"
                  placement:
                    label: osd_encrypt_lv
                  spec:
                    data_devices:
                      size: "'1G:'"

  - test:
      name: Encrypted OSD deployment on RAW device
      desc: Deploy encrypted OSDs on RAW devices
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_encrypted_raw
                  encrypted: "true"
                  placement:
                    label: osd_encrypt_raw
                  spec:
                    method: raw
                    data_devices:
                      size: "'1G:'"

  - test:
      name: non-encrypted OSD deployment on LVM
      desc: Deploy non-encrypted OSDs on LVs
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_lv
                  placement:
                    label: osd_lv
                  spec:
                    data_devices:
                      size: "'1G:'"

  - test:
      name: non-encrypted OSD deployment on RAW device
      desc: Deploy non-encrypted OSDs on RAW devices
      module: test_cephadm.py
      polarion-id: CEPH-83573746
      abort-on-fail: true
      config:
        steps:
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: osd
                  service_id: osd_raw
                  placement:
                    label: osd_raw
                  spec:
                    method: raw
                    data_devices:
                      size: "'1G:'"

  - test:
      name: MDS Service deployment with spec
      desc: Add MDS services using spec file
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      config:
        steps:
          - config:
              command: shell
              args:               # arguments to ceph orch
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: apply_spec
              service: orch
              validate-spec-services: true
              specs:
                - service_type: mds
                  service_id: cephfs
                  placement:
                    label: mds

  - test:
      name: RGW Service deployment
      desc: RGW Service deployment
      module: test_cephadm.py
      polarion-id: CEPH-83574728
      config:
        steps:
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw

  - test:
      name: Configure client admin
      desc: Configures client admin node on cluster
      module: test_client.py
      polarion-id:
      config:
        command: add
        id: client.1                      # client Id (<type>.<Id>)
        nodes:                            # client node
          - node7:
              release: 7.1
              tag: z8
        install_packages:
          - ceph-common
          - ceph-base
        copy_admin_keyring: true          # Copy admin keyring to node
        caps:                             # authorize client capabilities
          mon: "allow *"
          osd: "allow *"
          mds: "allow *"
          mgr: "allow *"

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
      desc: Change config options to enable logging to file

  - test:
      name: Upgrade cluster to latest 7.x ceph version
      desc: Upgrade cluster to latest version
      module: test_upgrade_warn.py
      polarion-id: CEPH-83574934,CEPH-83573790
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true
        verify_cluster_health: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: EC Pool Recovery Improvement
      module: pool_tests.py
      polarion-id: CEPH-83573852
      config:
        ec_pool_recovery_improvement:
          create: true
          pool_name: ec_pool_recovery
          k: 2
          m: 2
          pg_num: 32
          plugin: jerasure
          max_objs: 300
          rados_read_duration: 10
          osd_max_backfills: 16
          osd_recovery_max_active: 16
          delete_pool: true
      desc: Verify Recovery of EC pool with only "k" shards available

  - test:
      name: EC pool LC
      module: rados_prep.py
      polarion-id: CEPH-83571632
      config:
        ec_pool:
          create: true
          pool_name: test_ec_pool
          pg_num: 64
          k: 2
          m: 2
          plugin: jerasure
          disable_pg_autoscale: true
          max_objs: 300
          rados_read_duration: 10
        set_pool_configs:
          pool_name: test_ec_pool
          configurations:
            pg_num: 32
            pgp_num: 32
            pg_autoscale_mode: 'on'
            compression_mode: force
            compression_algorithm: snappy
        delete_pools:
          - test_ec_pool
      desc: Create, modify & delete EC pools and run IO

  - test:
      name: EC pool with Overwrites
      module: rados_prep.py
      polarion-id: CEPH-83571730
      config:
        ec_pool:
          create: true
          pool_name: ec_pool_overwrite
          app_name: rbd
          pg_num: 32
          erasure_code_use_overwrites: "true"
          k: 2
          m: 2
          plugin: jerasure
          max_objs: 300
          rados_read_duration: 10
          test_overwrites_pool: true
          metadata_pool: re_pool_overwrite
          image_name: image_ec_pool
          image_size: 100M
        delete_pools:
          - ec_pool_overwrite
          - re_pool_overwrite
      desc: EC pool with Overwrites & create RBD pool

# below tests have been moved here from - tier-2_rados_test-clay-ecpool.yaml
  - test:
      name: EC pool with clay profile for RBD
      module: test_clay_ecpool.py
      polarion-id: CEPH-83574881
      config:
        clay_pool:
          profile_name: clay_profile1
          pool_name: clay_ec_pool1
          k: 4
          m: 3
          d: 6
          plugin: clay
          app_name: rbd
          erasure_code_use_overwrites: "true"
          crush-failure-domain: osd
          force: true
          test_overwrites_pool: true
          delete_pools: true
          image_name: test_clay_image1
          image_size: 50G
          metadata_pool: clay_meta_pool1
      desc: Create and delete CLAY profile EC pool with RBD Images

  - test:
      name: Pool tests with clay profile for RBD Images
      module: test_clay_ecpool.py
      polarion-id: CEPH-83574880
      config:
        clay_pool:
          profile_name: clay_profile2
          pool_name: clay_ec_pool2
          k: 4
          m: 2
          d: 5
          plugin: clay
          app_name: rbd
          erasure_code_use_overwrites: "true"
          crush-failure-domain: osd
          force: true
          test_overwrites_pool: true
          delete_pools: true
          image_name: test_clay_image2
          image_size: 50G
          metadata_pool: clay_meta_pool2
          test_tier3_system_tests: true
          test_compression:
            configurations:
              - config-1:
                  compression_mode: force
                  compression_algorithm: snappy
                  compression_required_ratio: 0.3
                  compression_min_blob_size: 1B
                  byte_size: 10KB
              - config-2:
                  compression_mode: passive
                  compression_algorithm: zlib
                  compression_required_ratio: 0.7
                  compression_min_blob_size: 10B
                  byte_size: 100KB
              - config-3:
                  compression_mode: aggressive
                  compression_algorithm: zstd
                  compression_required_ratio: 0.5
                  compression_min_blob_size: 1KB
                  byte_size: 100KB
      desc: Perform tests on EC pools having a RBD Image
